services:
  stats-server:
    build:
      context: ./ewm-stat-service/stat-server
      dockerfile: Dockerfile
    container_name: stats-server
    depends_on:
      stats-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://stats-db:5432/statDB
      - SPRING_DATASOURCE_USERNAME=stat
      - SPRING_DATASOURCE_PASSWORD=12345678
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
    ports:
      - "9090:9090"

  stats-db:
    image: postgres:16.1
    container_name: postgres-stats-db
    ports:
      - "5434:5432"
    volumes:
      - ./volumes/postgres-stats:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=statDB
      - POSTGRES_USER=stat
      - POSTGRES_PASSWORD=12345678
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  ewm-db:
    image: postgres:16.1
    container_name: postgres-ewm-db
    ports:
      - "5435:5432"
    volumes:
      - ./volumes/postgres-ewm:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=ewmDB
      - POSTGRES_USER=ewm
      - POSTGRES_PASSWORD=12345678
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  ewm-service:
    build:
      context: ./ewm-service
      dockerfile: Dockerfile
    container_name: ewm-service
    depends_on:
      ewm-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://ewm-db:5432/ewmDB
      - SPRING_DATASOURCE_USERNAME=ewm
      - SPRING_DATASOURCE_PASSWORD=12345678
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
      - STATS_SERVER_URL=http://stats-server:9090
    ports:
      - "8080:8080"